spring.application.name=campusone

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/campusone
spring.datasource.username=campusone_user
spring.datasource.password=Campus@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# JWT auth
app.security.jwt.secret=change-me-change-me-change-me-change-me
app.security.jwt.issuer=campusone
app.security.jwt.access-token-ttl=PT15M
app.security.jwt.refresh-token-ttl=P7D

# Optional bootstrap admin account
app.security.bootstrap-admin.enabled=false
app.security.bootstrap-admin.registration-number=ADMIN001
app.security.bootstrap-admin.full-name=Campus One Admin
app.security.bootstrap-admin.email=admin@student.annauniv.edu
app.security.bootstrap-admin.password=Admin@12345
app.security.bootstrap-admin.department=Administration
app.security.bootstrap-admin.year=4
app.security.bootstrap-admin.phone-number=9999999999