spring.application.name=campusone

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/gather_db
spring.datasource.username=postgres
spring.datasource.password=Syam@04340550
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
