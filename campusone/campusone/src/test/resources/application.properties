spring.datasource.url=jdbc:h2:mem:campusone_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.security.jwt.secret=change-me-change-me-change-me-change-me
app.security.jwt.issuer=campusone-test
app.security.jwt.access-token-ttl=PT15M
app.security.jwt.refresh-token-ttl=P7D
