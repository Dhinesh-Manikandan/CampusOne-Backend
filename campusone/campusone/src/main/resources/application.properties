spring.application.name=campusone

# Server
server.port=${PORT:8080}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campusone_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Campus@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT auth
app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.jwt.issuer=${JWT_ISSUER:campusone}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Optional bootstrap admin account
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.registration-number=${BOOTSTRAP_ADMIN_REG_NO:ADMIN001}
app.security.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:Campus One Admin}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@student.annauniv.edu}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
app.security.bootstrap-admin.department=${BOOTSTRAP_ADMIN_DEPT:Administration}
app.security.bootstrap-admin.year=${BOOTSTRAP_ADMIN_YEAR:4}
app.security.bootstrap-admin.phone-number=${BOOTSTRAP_ADMIN_PHONE:9999999999}