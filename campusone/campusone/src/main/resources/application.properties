spring.application.name=campusone

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/campusone
spring.datasource.username=campusone_user
spring.datasource.password=Campus@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080